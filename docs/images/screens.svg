    <rect x="770" y="440" width="470" height="44" rx="5" fill="#161820"/><rect x="770" y="440" width="6" height="44" fill="#626877"/><text x="790" y="469" fill="#e8e8e8">LOOK</text><text x="920" y="469" fill="#626877" font-size="15" font-weight="400">icon and its colour</text>
