    <rect x="40" y="210" width="210" height="80" rx="6" fill="#161820"/><rect x="40" y="210" width="6" height="80" fill="#3fe0d0"/>
    <text x="62" y="246" fill="#e8e8e8">SCENES</text><text x="62" y="274" fill="#626877" font-size="15" font-weight="400">sets of 12 pads</text>
    <rect x="40" y="310" width="210" height="80" rx="6" fill="#161820"/><rect x="40" y="310" width="6" height="80" fill="#ffd23f"/>
    <text x="62" y="346" fill="#e8e8e8">MIXER</text><text x="62" y="374" fill="#626877" font-size="15" font-weight="400">strips + drawer</text>
    <rect x="40" y="430" width="210" height="80" rx="6" fill="#161820"/><rect x="40" y="430" width="6" height="80" fill="#626877"/>
